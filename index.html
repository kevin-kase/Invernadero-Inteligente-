<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Greenhouse</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

  <header>
    <h1>🌱 Smart Greenhouse Dashboard</h1>
    <p>Monitoreo Inteligente del Invernadero</p>
  </header>

  <main>

    <div class="cards">

      <div class="card">
        <h2>🌡️ Temperatura</h2>
        <p id="temp">28°C</p>
      </div>

      <div class="card">
        <h2>💧 Humedad Aire</h2>
        <p id="humedad">65%</p>
      </div>

      <div class="card">
        <h2>🌱 Humedad Suelo</h2>
        <p id="suelo">HÚMEDO</p>
      </div>

      <div class="card">
        <h2>🚿 Estado Bomba</h2>
        <p id="bomba">APAGADA</p>
      </div>

    </div>

    <section class="panel">

      <h2>📊 Temperatura en Tiempo Real</h2>

      <canvas id="grafica"></canvas>

    </section>

    <section class="controles">

      <h2>⚙️ Controles</h2>

      <button onclick="activarRiego()">
        Activar Riego
      </button>

      <button onclick="modoAutomatico()">
        Modo Automático
      </button>

    </section>

  </main>

  <footer>
    <p>Proyecto Arduino + GitHub Pages 🌱</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
